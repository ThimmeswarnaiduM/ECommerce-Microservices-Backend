global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'spring-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - localhost:8072   # gateway
          - localhost:8090   # customer-service
          - localhost:8091   # product-service
          - localhost:8060  # payment-service
          - localhost:8040   # notification-service
          - localhost:8070   # order-service
          - localhost:8761  # eureka-server
          - localhost:8088   # config-server
