server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # 🔥 REQUIRED
        http:
          endpoint: 0.0.0.0:4318   # optional but recommended

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
